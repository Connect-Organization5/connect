spring:
  application:
    name: user-service

  # 민감한 값은 환경변수로 주입. 로컬에서는 모듈 폴더의 .env 파일(git 제외)을 읽음 (.env.example 참고)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/connect_user}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Eureka 서버의 URL을 지정

service:
  jwt:
    access-expiration: 3600000
    # gateway 의 service.jwt.secret-key 와 같은 값이어야 함
    secret-key: ${JWT_SECRET_KEY}

server:
  port: 19090

# 소속별 초기 MASTER 계정 (MasterAccountInitializer 가 시작 시 없으면 BCrypt 로 암호화해서 생성)
# 비밀번호가 git 에 올라가지 않도록 여기 적지 말고 환경변수 또는 .env 로 주입
#   환경변수: ADMIN_MASTERS_0_USERNAME, ADMIN_MASTERS_0_PASSWORD, ... (두 번째 소속은 ADMIN_MASTERS_1_...)
#   .env    : admin.masters[0].username=..., admin.masters[0].password=... (.env.example 참고)
