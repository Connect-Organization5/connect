# 테스트 전용 설정 (@ActiveProfiles("test") 를 붙인 테스트에서 application.yml 위에 덮어씀)
# - 실제 PostgreSQL 대신 H2 인메모리 DB 사용 → 로컬 DB 를 건드리지 않고, PostgreSQL 이 없는 환경(팀원 PC, CI)에서도 실행 가능
# - Eureka 등록 끔 → 테스트 서버가 실제 서비스 목록에 등록되지 않음
# - 실제 JWT 키 대신 테스트 전용 키 사용

spring:
  datasource:
    url: jdbc:h2:mem:user_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    enabled: false

service:
  jwt:
    # 테스트 전용 키 (HS512 용 64바이트, Base64URL). 실제 서비스 키와 무관
    secret-key: ve9pH-qVwKRgF9a9pgaQYMKDZzCFP8CafxhkcOd0AH8AyQwljrf_q7mHN-TFE9OzKEqnU_xLLu1NQOlcUnsKGQ
