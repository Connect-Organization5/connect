spring:
  application:
    name: delivery-service

  datasource:
    url: ${DELIVERY_DB_URL:jdbc:postgresql://localhost:5433/connect_delivery}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  tracing:
    sampling:
      probability: 1.0   # 개발용: 요청 100% 기록
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
