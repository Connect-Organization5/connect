spring:
  application:
    name: delivery-service

  datasource:
    url: ${DELIVERY_DB_URL:jdbc:postgresql://localhost:5433/connect_delivery}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

delivery:
  assignment:
    # 자동 배정 시 같은 구간(출발·도착 허브)의 출발 전 배송을 한 담당자에게 묶는 최대 건수. 넘으면 부하 분산으로 배정, 0 이면 묶음 배정 끔
    bundle-max-size: ${DELIVERY_BUNDLE_MAX_SIZE:5}

management:
  tracing:
    sampling:
      probability: 1.0   # 개발용: 요청 100% 기록
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
