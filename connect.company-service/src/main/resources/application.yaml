server:
  port: 8082

spring:
  application:
    name: company-service

  datasource:
    url: ${COMPANY_DB_URL:jdbc:postgresql://localhost:5432/connect_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/