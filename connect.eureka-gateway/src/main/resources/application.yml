server:
  port: 8080

spring:
  application:
    name: eureka-gateway

  main:
    web-application-type: reactive  # Spring 애플리케이션이 리액티브 웹 애플리케이션으로 설정됨

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/auth/login, /auth/signup, /auth/**, /users/**

            - id: hub-service
              uri: lb://hub-service
              predicates:
                - Path=/hubs, /hubs/**

            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/companies, /companies/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders, /orders/**

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/deliveries, /deliveries/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway

service:
  jwt:
    secret-key: "401b09eab3c013d4ca54922bb802bec8fd5318192b0a75f201d8b3727429080fb337591abd3e44453b954555b7a0812e1081c39b740293f765eae731f5a65ed1"